services:
  mongo:
    image: mongo:7
    container_name: tournamently-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
    container_name: tournamently-server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/tournamently
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      NODE_ENV: production

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: tournamently-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"

  seed:
    build:
      context: ./server
    profiles: ["seed"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/tournamently
    command: ["node", "dist/seed/tmtekken.js"]

volumes:
  mongo-data:
